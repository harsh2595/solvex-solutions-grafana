name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        required: true
        default: solvex-observability
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      require_grafana_assets:
        description: Fail if Grafana dashboards, contact points, templates, or alert rules are missing
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      stack_name:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      require_grafana_assets:
        required: false
        type: boolean
        default: true
    secrets:
      GRAFANA_TOKEN:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    name: Run smoke tests
    runs-on: ubuntu-latest
    env:
      STACK_NAME: ${{ inputs.stack_name }}
      AWS_REGION: ${{ inputs.aws_region }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required GitHub variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "Missing GitHub repository variable AWS_ROLE_ARN."
            echo "Create an AWS IAM role trusted by GitHub OIDC, then set AWS_ROLE_ARN to that role ARN."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          args=(
            "--stack-name" "$STACK_NAME"
            "--region" "$AWS_REGION"
          )

          if [[ "${{ inputs.require_grafana_assets }}" == "true" ]]; then
            args+=("--require-grafana-assets")
          fi

          scripts/smoke-test.py "${args[@]}"
