name: Deploy Observability Platform

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        required: true
        default: solvex-observability
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      parameter_file:
        description: Parameter JSON file
        required: true
        default: infra/parameters/dev.json
  push:
    branches:
      - main
    paths:
      - infra/**
      - grafana/**
      - scripts/**
      - .github/workflows/deploy-observability.yml

permissions:
  id-token: write
  contents: read

env:
  STACK_NAME: ${{ github.event.inputs.stack_name || vars.STACK_NAME || 'solvex-observability' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}
  PARAMETER_FILE: ${{ github.event.inputs.parameter_file || vars.PARAMETER_FILE || 'infra/parameters/dev.json' }}
  TEMPLATE_FILE: infra/main.yaml

jobs:
  validate:
    name: Validate templates and JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Grafana JSON assets
        run: scripts/validate-json.sh .

      - name: Check required GitHub variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || vars.aws_role_arn || secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "Missing GitHub repository variable aws_role_arn / AWS_ROLE_ARN, or secret AWS_ROLE_ARN."
            echo "Create an AWS IAM role trusted by GitHub OIDC, then set AWS_ROLE_ARN to that role ARN."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || vars.aws_role_arn || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body "file://${TEMPLATE_FILE}" --region "$AWS_REGION"

  deploy-platform:
    name: Deploy AWS platform
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      workspace_id: ${{ steps.outputs.outputs.workspace_id }}
      grafana_endpoint: ${{ steps.outputs.outputs.grafana_endpoint }}
      sns_topic_arn: ${{ steps.outputs.outputs.sns_topic_arn }}
      cloudwatch_dashboard_name: ${{ steps.outputs.outputs.cloudwatch_dashboard_name }}
      environment_name: ${{ steps.parameters.outputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || vars.aws_role_arn || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render CloudFormation parameter overrides
        id: parameters
        run: |
          python3 - "$PARAMETER_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import shlex
          import sys

          parameter_file, output_file = sys.argv[1], sys.argv[2]
          with open(parameter_file, "r", encoding="utf-8") as file_obj:
              parameters = json.load(file_obj)

          overrides = " ".join(
              f"{key}={shlex.quote(str(value))}" for key, value in parameters.items()
          )
          with open(output_file, "a", encoding="utf-8") as output:
              print(f"overrides={overrides}", file=output)
              print(f"environment_name={parameters.get('EnvironmentName', 'dev')}", file=output)
          PY

      - name: Check CloudFormation stack state
        run: |
          set +e
          stack_status="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null
          )"
          describe_status=$?
          set -e

          if [[ "$describe_status" -ne 0 ]]; then
            echo "Stack $STACK_NAME does not exist yet; continuing with create."
            exit 0
          fi

          if [[ "$stack_status" == "ROLLBACK_COMPLETE" ]]; then
            echo "Stack $STACK_NAME is ROLLBACK_COMPLETE and cannot be updated."
            echo "Delete the failed stack in CloudFormation, then rerun this workflow."
            exit 1
          fi

          if [[ "$stack_status" == "REVIEW_IN_PROGRESS" ]]; then
            echo "Stack $STACK_NAME is REVIEW_IN_PROGRESS from a failed change set."
            echo "Delete the incomplete stack in CloudFormation, then rerun this workflow."
            exit 1
          fi

          echo "Stack $STACK_NAME status is $stack_status; continuing."

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameter-overrides ${{ steps.parameters.outputs.overrides }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Show CloudFormation failure events
        if: failure()
        run: |
          aws cloudformation list-change-sets \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Summaries[0:10].[ChangeSetName,Status,StatusReason,CreationTime]" \
            --output table || true

          change_set_name="$(
            aws cloudformation list-change-sets \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Summaries[0].ChangeSetName" \
              --output text 2>/dev/null || true
          )"

          if [[ -n "$change_set_name" && "$change_set_name" != "None" ]]; then
            aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION" \
              --query "[ChangeSetName,Status,ExecutionStatus,StatusReason]" \
              --output table || true

            aws cloudformation describe-events \
              --stack-name "$STACK_NAME" \
              --change-set-name "$change_set_name" \
              --region "$AWS_REGION" \
              --filters FailedEvents=true \
              --query "OperationEvents[0:30].[Timestamp,EventType,LogicalResourceId,ResourceType,ValidationName,ValidationStatus,ValidationPath,ValidationStatusReason,ResourceStatusReason]" \
              --output table || true
          fi

          aws cloudformation describe-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --filters FailedEvents=true \
            --query "OperationEvents[0:30].[Timestamp,EventType,LogicalResourceId,ResourceType,ValidationName,ValidationStatus,ValidationPath,ValidationStatusReason,ResourceStatusReason]" \
            --output table || true

          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[0:30].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      - name: Export stack outputs
        id: outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region "$AWS_REGION" \
            --output json > stack-outputs.json

          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          output_file = sys.argv[1]
          with open("stack-outputs.json", "r", encoding="utf-8") as file_obj:
              raw_outputs = json.load(file_obj)

          outputs = {item["OutputKey"]: item["OutputValue"] for item in raw_outputs}
          mapping = {
              "WorkspaceId": "workspace_id",
              "WorkspaceEndpoint": "grafana_endpoint",
              "SnsTopicArn": "sns_topic_arn",
              "CloudWatchDashboardName": "cloudwatch_dashboard_name",
          }
          with open(output_file, "a", encoding="utf-8") as output:
              for output_key, github_key in mapping.items():
                  print(f"{github_key}={outputs[output_key]}", file=output)
          PY

  deploy-grafana-assets:
    name: Deploy Grafana assets
    runs-on: ubuntu-latest
    needs: deploy-platform
    env:
      WORKSPACE_ID: ${{ needs.deploy-platform.outputs.workspace_id }}
      GRAFANA_ENDPOINT: ${{ needs.deploy-platform.outputs.grafana_endpoint }}
      SNS_TOPIC_ARN: ${{ needs.deploy-platform.outputs.sns_topic_arn }}
      CLOUDWATCH_DASHBOARD_NAME: ${{ needs.deploy-platform.outputs.cloudwatch_dashboard_name }}
      ENVIRONMENT: ${{ needs.deploy-platform.outputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || vars.aws_role_arn || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Grafana workspace to become active
        run: |
          for attempt in {1..60}; do
            status="$(
              aws grafana describe-workspace \
                --workspace-id "$WORKSPACE_ID" \
                --region "$AWS_REGION" \
                --query "workspace.status" \
                --output text
            )"
            echo "Workspace $WORKSPACE_ID status: $status"

            if [[ "$status" == "ACTIVE" ]]; then
              exit 0
            fi

            if [[ "$status" == "CREATION_FAILED" || "$status" == "UPDATE_FAILED" || "$status" == "DELETION_FAILED" || "$status" == "DELETING" ]]; then
              echo "Workspace $WORKSPACE_ID reached terminal status: $status"
              exit 1
            fi

            sleep 10
          done

          echo "Workspace $WORKSPACE_ID did not become ACTIVE within 10 minutes."
          exit 1

      - name: Create short-lived Grafana service account token
        run: |
          token="$(
            scripts/ensure-service-account-token.sh \
              --workspace-id "$WORKSPACE_ID" \
              --region "$AWS_REGION" \
              --service-account-name github-actions-deployer \
              --grafana-role ADMIN \
              --token-ttl-seconds 3600
          )"
          echo "::add-mask::$token"
          echo "GRAFANA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy Grafana folders, data source, dashboards, and alerts
        run: |
          scripts/deploy-grafana-assets.py \
            --endpoint "$GRAFANA_ENDPOINT" \
            --token "$GRAFANA_TOKEN" \
            --region "$AWS_REGION" \
            --sns-topic-arn "$SNS_TOPIC_ARN" \
            --environment "$ENVIRONMENT"

      - name: Run smoke tests
        run: |
          scripts/smoke-test.py \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --token "$GRAFANA_TOKEN" \
            --require-grafana-assets
