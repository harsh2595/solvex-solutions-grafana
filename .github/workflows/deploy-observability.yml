name: Deploy Observability Platform

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        required: true
        default: solvex-observability
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      parameter_file:
        description: Parameter JSON file
        required: true
        default: infra/parameters/dev.json
  push:
    branches:
      - main
    paths:
      - infra/**
      - grafana/**
      - scripts/**
      - .github/workflows/deploy-observability.yml

permissions:
  id-token: write
  contents: read

env:
  STACK_NAME: ${{ github.event.inputs.stack_name || vars.STACK_NAME || 'solvex-observability' }}
  AWS_REGION: ${{ github.event.inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}
  PARAMETER_FILE: ${{ github.event.inputs.parameter_file || vars.PARAMETER_FILE || 'infra/parameters/dev.json' }}
  TEMPLATE_FILE: infra/main.yaml

jobs:
  validate:
    name: Validate templates and JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Grafana JSON assets
        run: scripts/validate-json.sh .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body "file://${TEMPLATE_FILE}" --region "$AWS_REGION"

  deploy-platform:
    name: Deploy AWS platform
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      workspace_id: ${{ steps.outputs.outputs.workspace_id }}
      grafana_endpoint: ${{ steps.outputs.outputs.grafana_endpoint }}
      sns_topic_arn: ${{ steps.outputs.outputs.sns_topic_arn }}
      cloudwatch_dashboard_name: ${{ steps.outputs.outputs.cloudwatch_dashboard_name }}
      environment_name: ${{ steps.parameters.outputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render CloudFormation parameter overrides
        id: parameters
        run: |
          python3 - "$PARAMETER_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import shlex
          import sys

          parameter_file, output_file = sys.argv[1], sys.argv[2]
          with open(parameter_file, "r", encoding="utf-8") as file_obj:
              parameters = json.load(file_obj)

          overrides = " ".join(
              f"{key}={shlex.quote(str(value))}" for key, value in parameters.items()
          )
          with open(output_file, "a", encoding="utf-8") as output:
              print(f"overrides={overrides}", file=output)
              print(f"environment_name={parameters.get('EnvironmentName', 'dev')}", file=output)
          PY

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameter-overrides ${{ steps.parameters.outputs.overrides }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Export stack outputs
        id: outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region "$AWS_REGION" \
            --output json > stack-outputs.json

          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          output_file = sys.argv[1]
          with open("stack-outputs.json", "r", encoding="utf-8") as file_obj:
              raw_outputs = json.load(file_obj)

          outputs = {item["OutputKey"]: item["OutputValue"] for item in raw_outputs}
          mapping = {
              "WorkspaceId": "workspace_id",
              "WorkspaceEndpoint": "grafana_endpoint",
              "SnsTopicArn": "sns_topic_arn",
              "CloudWatchDashboardName": "cloudwatch_dashboard_name",
          }
          with open(output_file, "a", encoding="utf-8") as output:
              for output_key, github_key in mapping.items():
                  print(f"{github_key}={outputs[output_key]}", file=output)
          PY

  deploy-grafana-assets:
    name: Deploy Grafana assets
    runs-on: ubuntu-latest
    needs: deploy-platform
    env:
      WORKSPACE_ID: ${{ needs.deploy-platform.outputs.workspace_id }}
      GRAFANA_ENDPOINT: ${{ needs.deploy-platform.outputs.grafana_endpoint }}
      SNS_TOPIC_ARN: ${{ needs.deploy-platform.outputs.sns_topic_arn }}
      CLOUDWATCH_DASHBOARD_NAME: ${{ needs.deploy-platform.outputs.cloudwatch_dashboard_name }}
      ENVIRONMENT: ${{ needs.deploy-platform.outputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create short-lived Grafana service account token
        run: |
          token="$(
            scripts/ensure-service-account-token.sh \
              --workspace-id "$WORKSPACE_ID" \
              --region "$AWS_REGION" \
              --service-account-name github-actions-deployer \
              --grafana-role ADMIN \
              --token-ttl-seconds 3600
          )"
          echo "::add-mask::$token"
          echo "GRAFANA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy Grafana folders, data source, dashboards, and alerts
        run: |
          scripts/deploy-grafana-assets.py \
            --endpoint "$GRAFANA_ENDPOINT" \
            --token "$GRAFANA_TOKEN" \
            --region "$AWS_REGION" \
            --sns-topic-arn "$SNS_TOPIC_ARN" \
            --environment "$ENVIRONMENT"

      - name: Run smoke tests
        run: |
          scripts/smoke-test.py \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --token "$GRAFANA_TOKEN" \
            --require-grafana-assets
